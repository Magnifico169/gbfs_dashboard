name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  lintr:
    name: lintr (R)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::lintr
          needs: lint
      - name: Run lintr
        shell: Rscript {0}
        run: |
          files <- list.files(
            pattern = "\\.[Rr]$", recursive = TRUE, full.names = TRUE
          )
          if (length(files) == 0L) {
            message("R-файлов нет, проверять нечего")
            quit(status = 0L)
          }
          lints <- unlist(lapply(files, lintr::lint), recursive = FALSE)
          if (length(lints) > 0L) {
            print(structure(lints, class = "lints"))
            quit(status = 1L)
          }
