name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gbfs
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gbfs
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gbfs" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: gbfs
      PGPASSWORD: test
      PGDATABASE: gbfs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test services/api/tests/test_chart_math.cjs
      - run: uv run pytest
        working-directory: services/api
      - run: uv run alembic upgrade head
        working-directory: services/api
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::DBI, any::RPostgres, any::jsonlite
      - run: Rscript tests/test_rollups.R
        working-directory: services/analytics
      - run: Rscript tests/test_insights.R
        working-directory: services/analytics
      - run: Rscript tests/test_database.R
        working-directory: services/analytics
