[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "S",       # flake8-bandit
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
]

ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках, докстрингах и комментариях
]

[tool.ruff.lint.per-file-ignores]
"services/api/app/models/*.py" = ["RUF012"]  # __table_args__ — штатная идиома SQLAlchemy
"**/tests/**" = ["S101"]  # assert в тестах допустим

[tool.uv.workspace]
members = ["services/api"]
