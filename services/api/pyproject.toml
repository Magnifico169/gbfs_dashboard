[project]
name = "gbfs-api"
version = "0.1.0"
description = "GBFS Dashboard: API, приём фидов GBFS и миграции PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "SQLAlchemy>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
